[package]
name = "local-llm-token-usage-monitor"
version = "0.2.18"
description = "Monitor local LLM token usage across multiple providers"
authors = ["hajifish"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hajifish/LLM-Token-Usage-Monitor-Desktop"

[lib]
name = "local_llm_token_usage_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：tauri.conf.json 的 macOSPrivateApi=true（窗口 transparent + hudWindow 毛玻璃）必需；
# tauri CLI 会按配置自动注入，直接 cargo check/test/build（CI、IDE）时需在此显式声明
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
# 应用内自动更新：检查 GitHub Releases 静态清单 latest.json，minisign 签名校验后原地安装
tauri-plugin-updater = "2"
# 低余额主动系统通知：从 Rust 侧直接发送（不依赖 webview 打开）
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rt：spawn_blocking——Qoder 钥匙串链路（可阻塞 60s 的授权弹窗）必须脱离 async worker
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
log = "0.4"
# 日志落地（LogDir + Stdout）：未安装 logger 时 log crate 走 NopLogger，
# release 构建下迁移失败/解密失败/指纹降级等诊断信息会全部丢失
tauri-plugin-log = "2"
# 本地加密存储：XChaCha20-Poly1305 AEAD + blake3 密钥派生 + base64 编码（均为纯 Rust 实现）
chacha20poly1305 = "0.11"
# pure 特性禁用 C/汇编实现，避免引入 cc 依赖与交叉编译敏感点（本应用每次启动仅一次 KDF，吞吐无关）
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
base64 = "0.23"
tray-icon = "0.24"
# 敏感数据（派生密钥、明文配置）离开作用域时清零，减少内存滞留
zeroize = "1"
# 用户主目录解析（Codex/Claude Code CLI 凭证路径）
dirs = "7"
# Qoder 客户端本地凭据解密：auth.v1.dat = "v10" + AES-128-CBC（IV=16 空格），
# 密钥 = PBKDF2-SHA1(钥匙串 "<App> Safe Storage", "saltysalt", 1003 轮)（均纯 Rust 实现）
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"

# Windows 机器指纹来源：注册表 MachineGuid
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

# 托盘菜单文本测量：muda 未暴露 NSMenuItem 原生句柄，无法设置 attributedTitle/右制表位，
# 只能用菜单字体量宽度后以空格把「值」补到统一右边界（见 menu_align.rs）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSFont",
    "NSStringDrawing",
    "NSAttributedString",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSDictionary",
    "NSAttributedString",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
