name: Release

on:
  # 发版靠手打 tag 触发：git tag v0.3.0 && git push origin v0.3.0
  # （手推的 tag 会正常级联触发本工作流；不要再引入用 GITHUB_TOKEN 推 tag 的自动化，
  #   那样的事件不会触发 workflow）
  push:
    tags:
      - 'v*'
  # 兜底：tag 推送未能触发时，可手动跑 gh workflow run release.yml --ref <tag>
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned 2026-09-03)

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          # 版本号直接取 tag（v0.3.0 -> 0.3.0），不再从 tag 数量派生。
          # 只认 vX.Y.Z：号段必须人工决定，保证全局单调递增
          # （应用内更新按 semver 比较，只升不降）。
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::发布 tag 必须是 vX.Y.Z 形式，当前为 ${TAG}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=Token Usage ${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Set version in manifests
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version || echo "Version already $VERSION"
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" src-tauri/Cargo.toml && rm src-tauri/Cargo.toml.bak
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));c.version='$VERSION';fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(c,null,2)+'\n')"

      # 构建并直接维护 draft Release：上传各平台安装包、更新签名与 latest.json 静态清单。
      # 只有手动发布（取消 draft）后，releases/latest/download/latest.json 才对外可见，
      # 因此「发布草稿」这一步天然是更新分发闸门。
      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@51a9f1156b33df106d827c3a78f8f894946c5faa # v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.ver.outputs.title }}
          releaseDraft: true
          prerelease: false
          # 生成 latest.json（含各平台 URL 与 minisign 签名）
          includeUpdaterJson: true
          # 自动更新走 NSIS（per-user 安装，无需 UAC）；MSI 仅作为手动下载选项
          updaterJsonPreferNsis: true

  # Tauri 会按 productName 生成 Token.Usage_0.3.0_aarch64.dmg 这类带点的名字，
  # 这里统一成 TokenUsage-0.3.0-aarch64.dmg，并同步改写 latest.json 里的下载地址
  # （只改文件名，签名文件内容不动，更新校验不受影响）。
  normalize:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Normalize asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          bash scripts/normalize-release-assets.sh "$TAG" "${TAG#v}"

  release-notes:
    needs: [release, normalize]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Resolve release title
        id: ver
        run: echo "title=Token Usage ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 发版说明来源：优先仓库内 docs/release-notes/vX.Y.Z.md（发版前随代码入库），
      # 缺失则回退 GitHub 自动生成（此时 latest.json 的 notes 保持为空，应用内
      # 更新弹窗将不显示说明——正式发版应始终携带说明文件）。
      - name: Resolve release notes
        id: notes
        run: |
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "source=file" >> "$GITHUB_OUTPUT"
            echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
            echo "Using notes file: ${NOTES_FILE}"
          else
            echo "source=generated" >> "$GITHUB_OUTPUT"
            echo "::warning::未找到 ${NOTES_FILE}，回退自动生成说明（应用内更新弹窗将无说明文本）"
          fi

      # 用 gh release edit 而非 softprops action：后者在「更新既有草稿」路径上
      # body_path 不生效（v0.6.0 实测——发布成功但页面正文为空，latest.json 的
      # Patch 步骤正常）。gh 语义已手工实证，且少一层第三方 action 行为。
      - name: Fill release notes from file
        if: steps.notes.outputs.source == 'file'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.ver.outputs.title }}" \
            --notes-file "${{ steps.notes.outputs.path }}"

      - name: Fill generated release notes
        if: steps.notes.outputs.source == 'generated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.ver.outputs.title }}" --generate-notes

      # latest.json 由构建 job 在说明就位前生成，notes 字段为空；这里把同一份
      # 说明补写进 latest.json 并覆盖上传——应用内更新弹窗读取的是该文件的
      # notes 字段（Tauri updater），不是 GitHub Release 页面正文。
      - name: Patch latest.json notes
        if: steps.notes.outputs.source == 'file'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p /tmp/relnotes && cd /tmp/relnotes
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "latest.json" --clobber
          jq --rawfile notes "$GITHUB_WORKSPACE/${{ steps.notes.outputs.path }}" '.notes = $notes' latest.json > latest.new.json
          mv latest.new.json latest.json
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" latest.json --clobber
          echo "latest.json notes patched"
