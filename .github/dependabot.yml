version: 2
updates:
  # Tauri 官方包（npm 的 @tauri-apps/* 与 cargo 的 tauri / tauri-build）必须成对升级：
  # 两者版本错位时 `tauri build` 会静默失败（退出码 0 但不产出新 bundle）。
  # Dependabot 只能按生态单边提 PR，因此这一对核心包改为人工成对升级。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "@tauri-apps/*"
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "tauri"
      - dependency-name: "tauri-build"
    # 插件版本彼此独立，合并成一个 PR 减少噪音
    groups:
      tauri-plugins:
        patterns:
          - "tauri-plugin-*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
