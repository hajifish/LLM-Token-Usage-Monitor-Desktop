name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # 版本号派生需要完整的 tag 历史（git tag -l 计数）
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned 2026-09-03)

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: |
          # 版本号必须全局单调递增（应用内更新的 semver 比较只升不降），
          # 因此不使用日期 tag 直接派生，而是用仓库 v* tag 总数作为 patch：
          # 0.2.<tag 总数>；超过 255（Windows MSI 每段上限）自动进位 minor。
          COUNT=$(git tag -l 'v*' | wc -l | tr -d ' ')
          MINOR=$((2 + COUNT / 256))
          PATCH=$((COUNT % 256))
          NEW_VERSION="0.${MINOR}.${PATCH}"
          echo "Setting version to $NEW_VERSION ($COUNT existing v* tags)"
          npm version "$NEW_VERSION" --no-git-tag-version || echo "Version already $NEW_VERSION"
          sed -i.bak "s/^version = .*/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml && rm src-tauri/Cargo.toml.bak
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));c.version='$NEW_VERSION';fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(c,null,2)+'\n')"

      # 构建并直接维护 draft Release：上传各平台安装包、更新签名与 latest.json 静态清单。
      # 只有手动发布（取消 draft）后，releases/latest/download/latest.json 才对外可见，
      # 因此「发布草稿」这一步天然是更新分发闸门。
      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@51a9f1156b33df106d827c3a78f8f894946c5faa # v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # 生成 latest.json（含各平台 URL 与 minisign 签名）
          includeUpdaterJson: true
          # 自动更新走 NSIS（per-user 安装，无需 UAC）；MSI 仅作为手动下载选项
          updaterJsonPreferNsis: true

  release-notes:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Fill generated release notes
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.0
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
